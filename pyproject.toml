[project]
name = "portfolio-ai-tour-guide"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Quentin Leguay", email = "33553005+QuentinElGuay@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "fastembed>=0.8.0",
    "gradio>=6.22.0",
    "httpx>=0.28.1",
    "openai>=2.52.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "sqlalchemy>=2.0.51",
    "tqdm>=4.70.0",
]

[project.scripts]
portfolio-ai-tour-guide-agent = "ai_tour_guide.agent.cli:main"
portfolio-ai-tour-guide-ingestion = "ai_tour_guide.ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ai_tour_guide"

[tool.ruff.format]
# Configure code formatting style
quote-style = "single"
indent-style = "space"

[tool.mdformat]
wrap = 88
end_of_line = "lf"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "mdformat>=1.0.0",
    "mdformat-gfm>=1.0.0",
    "mdformat-pyproject>=0.1.1",
    "pip>=26.2.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
