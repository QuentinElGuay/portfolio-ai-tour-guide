name: Publish images

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5

jobs:
  airflow:
    name: Airflow DAG integration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure Airflow environment
        run: |
          cp .env.template .env
          echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Start Airflow services
        run: >-
          docker compose --profile airflow up --build -d --wait
          database airflow-webserver airflow-scheduler airflow-dag-processor

      - name: Verify DAG import
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if ! import_errors=$(docker compose --profile airflow exec -T \
              airflow-dag-processor airflow dags list-import-errors --output json); then
              sleep 5
              continue
            fi
            printf '%s\n' "$import_errors"
            if [ "$(jq 'length' <<<"$import_errors")" -eq 0 ]; then
              docker compose --profile airflow exec -T \
                airflow-dag-processor airflow dags list | grep -q 'ingest_documents'
              exit 0
            fi
            sleep 5
          done
          echo 'Airflow DAG import errors did not clear.' >&2
          exit 1

      - name: Stop Airflow
        if: always()
        run: docker compose --profile airflow down --volumes --remove-orphans

  publish:
    name: Build and publish release images
    needs: airflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish images
        shell: bash
        run: |
          set -euo pipefail
          image_owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_prefix="ghcr.io/${image_owner}/ai-tour-guide"
          version="${GITHUB_REF_NAME}"
          revision="sha-${GITHUB_SHA}"

          docker buildx build --push \
            --file docker/base.Dockerfile \
            --build-arg "EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME}" \
            --tag "${image_prefix}-base:${version}" \
            --tag "${image_prefix}-base:${revision}" \
            .

          for service in app ingestion; do
            docker buildx build --push \
              --file "docker/${service}.Dockerfile" \
              --build-context "ai-tour-guide-base=docker-image://${image_prefix}-base:${revision}" \
              --tag "${image_prefix}-${service}:${version}" \
              --tag "${image_prefix}-${service}:${revision}" \
              .
          done

          docker buildx build --push \
            --file docker/airflow.Dockerfile \
            --tag "${image_prefix}-airflow:${version}" \
            --tag "${image_prefix}-airflow:${revision}" \
            .

          docker buildx build --push \
            --file docker/metabase-database.Dockerfile \
            --tag "${image_prefix}-metabase-database:${version}" \
            --tag "${image_prefix}-metabase-database:${revision}" \
            .

  release:
    name: Create GitHub release
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create release from versioned notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "${notes_file}" || {
            echo "Release notes not found: ${notes_file}" >&2
            exit 1
          }
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${notes_file}"
