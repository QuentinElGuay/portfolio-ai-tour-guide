name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: localhost
  DB_PORT: "5432"
  DB_NAME: postgres
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_SCHEMA: public
  EMBEDDING_DIMENSIONS: "384"
  EMBEDDING_MODEL_NAME: BAAI/bge-small-en-v1.5
  EMBEDDING_NORMALIZE: "true"
  AGENT_LLM_API_KEY: test-token
  AGENT_LLM_MODEL: test-model

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Verify the lockfile
        run: uv lock --check

      - name: Lint and format Python
        run: |
          uv run ruff check src tests evaluation tools scripts airflow/dags
          uv run ruff format --check src tests evaluation tools scripts airflow/dags

      - name: Type check
        run: uv run pyright

      - name: Check Markdown formatting
        run: git ls-files -z '*.md' | xargs -0 uv run mdformat --check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: uv run pytest tests/unit

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Configure Docker Compose
        run: cp .env.template .env

      - name: Run fixture-backed smoke tests
        run: make smoke-test

      - name: Stop the test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  airflow-changes:
    name: Detect Airflow changes
    runs-on: ubuntu-latest
    outputs:
      airflow: ${{ steps.filter.outputs.airflow }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            airflow:
              - 'airflow/**'
              - 'docker-compose.yml'
              - 'docker/airflow.Dockerfile'
              - 'docker/base.Dockerfile'
              - 'docker/ingestion.Dockerfile'
              - 'src/ai_tour_guide/ingestion/**'
              - 'src/ai_tour_guide/knowledge_base/**'
              - '.env.template'
              - 'pyproject.toml'
              - 'uv.lock'

  airflow-config:
    name: Airflow configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Airflow environment
        run: |
          cp .env.template .env
          echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Validate Airflow Compose configuration
        run: docker compose --profile airflow config --quiet

  airflow:
    name: Airflow DAG integration
    needs: airflow-changes
    if: >-
      github.event_name == 'push' ||
      needs.airflow-changes.outputs.airflow == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure Airflow environment
        run: |
          cp .env.template .env
          echo "DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"

      - name: Start Airflow services
        run: >-
          docker compose --profile airflow up --build -d --wait
          database airflow-webserver airflow-scheduler airflow-dag-processor

      - name: Verify DAG import
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if ! import_errors=$(docker compose --profile airflow exec -T \
              airflow-dag-processor airflow dags list-import-errors --output json); then
              sleep 5
              continue
            fi
            printf '%s\n' "$import_errors"
            if [ "$(jq 'length' <<<"$import_errors")" -eq 0 ]; then
              docker compose --profile airflow exec -T \
                airflow-dag-processor airflow dags list | grep -q 'ingest_documents'
              exit 0
            fi
            sleep 5
          done
          echo 'Airflow DAG import errors did not clear.' >&2
          exit 1

      - name: Stop Airflow
        if: always()
        run: docker compose --profile airflow down --volumes --remove-orphans
