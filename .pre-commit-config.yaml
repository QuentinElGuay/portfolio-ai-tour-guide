repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: pyright
        name: Pyright type check
        entry: uv run pyright
        language: system
        pass_filenames: false
        always_run: true

      - id: mdformat
        name: mdformat
        entry: uv run mdformat
        language: system
        types: [markdown]
