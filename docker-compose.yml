name: ai-tour-guide

x-app-environment: &app-environment
  DB_HOST: database
  DB_PORT: "5432"
  DB_NAME: "${POSTGRES_DB}"
  DB_USER: "${POSTGRES_USER}"
  DB_PASSWORD: "${POSTGRES_PASSWORD}"

services:
  database:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ai-tour-guide

  ingestion:
    image: ai-tour-guide-ingestion:local

    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile

    profiles:
      - ingestion

    environment:
      <<: *app-environment

      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS}"

    volumes:
      - ./data:/app/data

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  agent:
    image: ai-tour-guide-agent:local

    build:
      context: .
      dockerfile: docker/agent.Dockerfile

    environment:
      <<: *app-environment

    ports:
      - "${AGENT_PORT:-8000}:8000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-tour-guide

volumes:
  postgres_data:

networks:
  ai-tour-guide:
    driver: bridge
