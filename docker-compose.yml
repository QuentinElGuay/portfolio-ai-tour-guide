name: ai-tour-guide

x-app-environment: &app-environment
  DB_HOST: database
  DB_PORT: "5432"
  DB_NAME: "${DB_NAME:?DB_NAME is required}"
  DB_USER: "${DB_USER:?DB_USER is required}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
  DB_SCHEMA: "${DB_SCHEMA:-public}"
  EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}"
  EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}"
  EMBEDDING_NORMALIZE: "${EMBEDDING_NORMALIZE:-true}"

services:
  ai-tour-guide-base:
    image: ai-tour-guide-base:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/base.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}"

    profiles:
      - tools
      - ingestion
      - agent
      - app

    scale: 0

  database:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: "${DB_NAME:?DB_NAME is required}"
      POSTGRES_USER: "${DB_USER:?DB_USER is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ai-tour-guide

  init-db:
    image: ai-tour-guide-ingestion:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
      additional_contexts:
        ai-tour-guide-base: service:ai-tour-guide-base

    profiles:
      - tools

    environment:
      <<: *app-environment
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}"

    command:
      [
        "python",
        "-m",
        "ai_tour_guide.knowledge_base.database.init",
      ]

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  ingestion:
    image: ai-tour-guide-ingestion:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
      additional_contexts:
        ai-tour-guide-base: service:ai-tour-guide-base

    profiles:
      - ingestion

    environment:
      <<: *app-environment

    volumes:
      - ./tmp:/app/tmp

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  agent:
    image: ai-tour-guide-agent:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      additional_contexts:
        ai-tour-guide-base: service:ai-tour-guide-base

    profiles:
      - agent
      - app

    environment:
      <<: *app-environment
      AGENT_LLM_PROVIDER: "${AGENT_LLM_PROVIDER:-openai}"
      AGENT_LLM_API_KEY: "${AGENT_LLM_API_KEY:-}"
      AGENT_LLM_MODEL: "${AGENT_LLM_MODEL:-gpt-4.1-mini}"

    ports:
      - "${AGENT_PORT:-8000}:8000"

    depends_on:
      database:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ai-tour-guide

  chat:
    image: ai-tour-guide-agent:local
    pull_policy: never

    profiles:
      - app

    environment:
      CHAT_API_URL: http://agent:8000/ask
      CHAT_HOST: 0.0.0.0
      CHAT_PORT: "7860"
      CHAT_TITLE: "${CHAT_TITLE:-Brittany AI Tour Guide}"

    command: ["python", "-m", "ai_tour_guide.agent.chat.app"]

    ports:
      - "${CHAT_PORT:-7860}:7860"

    depends_on:
      agent:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-tour-guide

  dashboard:
    image: metabase/metabase:latest

    profiles:
      - dashboard

    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: "${METABASE_DB_NAME:-metabase}"
      MB_DB_PORT: "5432"
      MB_DB_USER: "${DB_USER:?DB_USER is required}"
      MB_DB_PASS: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MB_DB_HOST: database

    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

    depends_on:
      metabase-database:
        condition: service_completed_successfully

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

    networks:
      - ai-tour-guide

  metabase-database:
    image: ai-tour-guide-metabase-database:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/metabase-database.Dockerfile

    profiles:
      - dashboard

    environment:
      PGHOST: database
      PGPORT: "5432"
      PGDATABASE: "${DB_NAME:?DB_NAME is required}"
      PGUSER: "${DB_USER:?DB_USER is required}"
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      METABASE_DB_NAME: "${METABASE_DB_NAME:-metabase}"

    command:
      - /bin/sh
      - -c
      - |
        set -eu
        case "$${METABASE_DB_NAME}" in
          ''|*[!a-z0-9_]*|[0-9]*)
            echo "METABASE_DB_NAME must be a lowercase PostgreSQL identifier" >&2
            exit 1
            ;;
        esac
        database_created=false
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$${METABASE_DB_NAME}'" | grep -q 1; then
          createdb "$${METABASE_DB_NAME}"
          database_created=true
        fi
        table_count=$$(psql --dbname "$${METABASE_DB_NAME}" -tAc \
          "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname = 'public'")
        if [ "$${database_created}" = true ] || [ "$${table_count}" -eq 0 ]; then
          if [ -s /backups/metabase.sql ]; then
            echo "Restoring bundled Metabase application database backup."
            psql --dbname "$${METABASE_DB_NAME}" --file /backups/metabase.sql
          else
            echo "No bundled Metabase backup found; starting with an empty application database."
          fi
        fi

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  dashboard-init:
    image: alpine:3.22

    profiles:
      - dashboard

    environment:
      METABASE_URL: http://dashboard:3000
      METABASE_ADMIN_EMAIL: "${METABASE_ADMIN_EMAIL:?METABASE_ADMIN_EMAIL is required}"
      METABASE_ADMIN_PASSWORD: "${METABASE_ADMIN_PASSWORD:?METABASE_ADMIN_PASSWORD is required}"
      METABASE_DATABASE_NAME: "${METABASE_DATABASE_NAME:-AI Tour Guide}"
      METABASE_DATABASE_HOST: database
      METABASE_HEALTH_TIMEOUT_SECONDS: "${METABASE_HEALTH_TIMEOUT_SECONDS:-300}"
      METABASE_DB_NAME: "${METABASE_DB_NAME:-metabase}"
      DB_NAME: "${DB_NAME:?DB_NAME is required}"
      DB_USER: "${DB_USER:?DB_USER is required}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_PORT: "5432"

    volumes:
      - ./scripts/bootstrap_metabase.sh:/scripts/bootstrap_metabase.sh:ro

    command:
      - /bin/sh
      - -c
      - apk add --no-cache bash curl jq >/dev/null && /bin/bash /scripts/bootstrap_metabase.sh

    depends_on:
      dashboard:
        condition: service_started

    restart: "no"

    networks:
      - ai-tour-guide

volumes:
  postgres_data:

networks:
  ai-tour-guide:
    driver: bridge
