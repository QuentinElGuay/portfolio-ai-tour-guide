name: ai-tour-guide

x-app-environment: &app-environment
  DB_HOST: database
  DB_PORT: "5432"
  DB_NAME: "${POSTGRES_DB:?POSTGRES_DB is required}"
  DB_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
  DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
  EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}"
  EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}"
  EMBEDDING_NORMALIZE: "${EMBEDDING_NORMALIZE:-true}"

services:
  database:
    image: pgvector/pgvector:pg17

    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - ai-tour-guide

  init-db:
    image: ai-tour-guide-ingestion:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}"

    profiles:
      - tools

    environment:
      <<: *app-environment
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}"

    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "ai_tour_guide.knowledge_base.init_db",
      ]

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  ingestion:
    image: ai-tour-guide-ingestion:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/ingestion.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}"

    profiles:
      - ingestion

    environment:
      <<: *app-environment

    volumes:
      - ./data:/app/data
      - ./tmp:/app/tmp

    depends_on:
      database:
        condition: service_healthy

    restart: "no"

    networks:
      - ai-tour-guide

  agent:
    image: ai-tour-guide-agent:local
    pull_policy: build

    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}"

    profiles:
      - agent

    environment:
      <<: *app-environment

    ports:
      - "${AGENT_PORT:-8000}:8000"

    depends_on:
      database:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-tour-guide

volumes:
  postgres_data:

networks:
  ai-tour-guide:
    driver: bridge
